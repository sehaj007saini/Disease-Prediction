services:
  # 1. Python ML Microservice (FastAPI + Scikit-Learn)
  - type: web
    name: disease-ml-service
    env: python
    region: singapore
    plan: free
    rootDir: Disease_Prediction
    buildCommand: "pip install -r requirements.txt && python train_models.py"
    startCommand: "uvicorn ml_api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 5000

  # 2. Java Spring Boot Backend Service (Docker container)
  - type: web
    name: disease-backend
    env: docker
    region: singapore
    plan: free
    rootDir: Disease_Prediction_Backend
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: disease-prediction-db
          property: connectionString
      - key: ML_SERVICE_URL
        value: https://disease-ml-service.onrender.com/predict
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 3. React Frontend Service (Static Site)
  - type: web
    name: disease-frontend
    env: static
    region: singapore
    plan: free
    rootDir: Disease_Prediction_Frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL Database Instance
  - name: disease-prediction-db
    databaseName: disease_prediction_db
    user: disease_user
    region: singapore
    plan: free
