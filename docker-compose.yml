version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: disease-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disease_prediction_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-disease_prediction_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI ML Microservice
  ml-service:
    build:
      context: ./Disease_Prediction
      dockerfile: Dockerfile
    container_name: disease-ml-service
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Spring Boot Backend API
  backend:
    build:
      context: ./Disease_Prediction_Backend
      dockerfile: Dockerfile
    container_name: disease-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-disease_prediction_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ML_SERVICE_URL: http://ml-service:5000/predict
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started

  # 4. React Vite Frontend (Nginx Server)
  frontend:
    build:
      context: ./Disease_Prediction_Frontend
      dockerfile: Dockerfile
    container_name: disease-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
